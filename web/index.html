<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tinyrenderer-rs</title>
<style>
  html, body { margin: 0; background: #000; }
  /* Sized by its width, so a frame on another page can be fitted to it. */
  body { max-width: 60rem; margin: 0 auto; }
  .controls { display: flex; gap: 0.5rem; padding: 0.5rem; }
  button { font: 15px system-ui, sans-serif; padding: 0.3rem 0.9rem; }
  /* The game draws a small square frame; scale it up to the width, as the
     native build's ScalingMode::Fill does. */
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<div class="controls">
  <button id="start">start</button>
  <button id="sound">unmute</button>
</div>
<canvas id="screen" width="320" height="320"></canvas>
<script type="module">
  // The game's sound starts muted. Its audio library (cpal) makes its own
  // AudioContext, so the page swaps in a subclass that stays suspended while
  // muted, even when cpal asks it to resume.
  let muted = true;
  const realResume = AudioContext.prototype.resume;
  class MutableAudioContext extends AudioContext {
    static instances = [];
    constructor(...args) {
      super(...args);
      MutableAudioContext.instances.push(this);
      if (muted) this.suspend();
    }
    resume() {
      return muted ? Promise.resolve() : realResume.call(this);
    }
  }
  window.AudioContext = MutableAudioContext;

  const soundButton = document.getElementById("sound");
  soundButton.addEventListener("click", () => {
    muted = !muted;
    soundButton.textContent = muted ? "unmute" : "mute";
    for (const context of MutableAudioContext.instances) {
      if (muted) context.suspend();
      else realResume.call(context);
    }
  });

  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d");
  const startButton = document.getElementById("start");
  let game = null;

  // Clicking the game locks the pointer, for mouse look (Escape unlocks it).
  canvas.addEventListener("click", () => {
    if (game !== null) canvas.requestPointerLock();
  });

  // The wasm (about 6 MB, mostly the models) loads only when asked for.
  startButton.addEventListener("click", async () => {
    startButton.disabled = true;
    canvas.requestPointerLock();
    // Imported here, not at the top: the bindings keep the AudioContext there
    // is when they load, which must be the subclass above.
    const bindings = await import("./pkg/tinyrenderer_wasm.js");
    const wasm = await bindings.default();
    game = new bindings.Game();
    startButton.hidden = true;
    const started = performance.now();
    let last = started;
    const tick = (now) => {
      game.frame(now - last, now - started);
      last = now;
      const w = game.frame_width();
      const h = game.frame_height();
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      // A view of the frame in the wasm memory, made afresh each frame: the
      // memory's buffer changes when it grows.
      const pixels = new Uint8ClampedArray(wasm.memory.buffer, game.frame_ptr(), w * h * 4);
      ctx.putImageData(new ImageData(pixels, w, h), 0, 0);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });

  window.addEventListener("keydown", (e) => {
    if (game === null || e.repeat) return;
    game.key_down(e.code);
  });
  window.addEventListener("keyup", (e) => {
    if (game !== null) game.key_up(e.code);
  });
  document.addEventListener("mousemove", (e) => {
    if (game !== null && document.pointerLockElement === canvas) {
      game.mouse_move(e.movementX, e.movementY);
    }
  });
</script>
</body>
</html>
