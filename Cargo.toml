[package]
name = "tinyrenderer-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

# The renderer's own dependencies, at tinyrenderer-rs's versions, minus the
# ones only its native main.rs uses (clap, env_logger, pixels).
[dependencies]
cpal = { version = "0.16.0", features = ["wasm-bindgen"] }
ena = "0.14.3"
glam = "0.30.5"
log = "0.4.27"
nom = "8.0.0"
rand = "0.9.2"
smallvec = { version = "1.15.1", features = ["union"] }
winit = "0.30.12"

# The browser side.
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
# Must match the wasm-bindgen CLI exactly (`wasm-bindgen --version`).
wasm-bindgen = "=0.2.129"
# rand gets its seed from getrandom, which needs to be told to use the browser's
# crypto.getRandomValues (see also .cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
debug = "line-tables-only"
